name: Refresh MLB data

# Runs update.py in the cloud on a schedule, verifies the result against the
# live sources, and commits the new data.js only if it checks out. GitHub Pages
# then redeploys the site automatically. No laptop needed.
#
# If a run fails, GitHub emails the repo owner and the run shows red under the
# Actions tab; the previous data.js stays live until the next successful run.

on:
  # Times are UTC (GitHub cron has no timezone). UTC-5 = Central during the season (CDT).
  schedule:
    - cron: '10 10 * * *'  # 5:10am CT — early refresh
    - cron: '15 12 * * *'  # 7:15am CT — probables/lineups firming up
    - cron: '0 14 * * *'   # 9:00am CT — lineups set
    - cron: '0 19 * * *'   # 2:00pm CT — late scratches & pitching changes
  workflow_dispatch: {}     # lets you trigger a refresh by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # a hung API call must not tie the job up for hours
    env:
      TZ: America/New_York   # so update.py's "today" is Eastern time, not UTC
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate data.js
        run: python update.py

      - name: Verify data.js against the live sources
        # Re-pulls every source independently and diffs field by field.
        # Non-zero exit = mismatch = nothing gets committed.
        run: python verify.py

      - name: Commit & push if data changed
        run: |
          git config user.name  "mlb-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --staged --quiet; then
            echo "No data change this run."
          else
            git commit -m "Auto-refresh data.js ($(date '+%Y-%m-%d %H:%M %Z'))"
            git push
          fi
